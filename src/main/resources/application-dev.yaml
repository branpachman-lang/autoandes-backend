server:
  port: 8080
spring:
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${DB_USERNAME:AutoAndesDB}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        format_sql: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
logging:
  level:
    root: INFO
    pe.edu.upeu.autoandes: DEBUG
app:
  jwt:
    secret: ${JWT_SECRET:}
